# =========================================
# SOYSMyLoot 主配置文件
# 战利品插件 —— 根据玩家对配置怪物造成的伤害/击杀，发放奖励
# =========================================

# 调试模式：开启后会在控制台输出详细追踪与存储读写日志
debug: false

# 自动保存间隔（秒）。0 = 关闭自动保存（仅在插件关闭/玩家退出时保存）
auto-save: 300

# 伤害追踪设置
tracking:
  # 是否追踪由玩家发射的投射物（箭、雪球、火球等）造成的伤害
  projectile: true
  # 是否追踪由玩家间接造成的伤害（火焰、掉落、窒息、药水持续伤害等）
  # 注意：间接伤害来源判定较复杂，开启后可能产生误判，默认关闭
  indirect: false
  # 进度归属模式：
  #   player -> 每名玩家独立累计（默认）
  #   team  -> 队伍/公会共享伤害（需安装 SOYSLinkTeam 软依赖，
  #            同一队伍成员对怪物的伤害累加到同一份队伍数据；不在队伍者回退个人累计）
  scope: player
  # 世界隔离：true=按世界分别统计进度（主世界/下界/末地各算各的）；
  #          false=跨世界汇总为一份进度
  world-isolation: true

# =========================================
# 领取反馈（音效与粒子）
# ------------------------------------------------------------
# 玩家成功领取奖励时播放的音效与粒子效果，提升交互体验。
# 所有音效/粒子名称使用 Spigot 1.12.2 原生枚举名，留空则不播放。
# =========================================
feedback:
  # 是否启用领取反馈
  enabled: true
  # 领取成功音效（Spigot Sound 枚举名，留空不播放）
  # 推荐：ENTITY_PLAYER_LEVELUP / UI_TOAST_CHALLENGE_COMPLETE / ENTITY_EXPERIENCE_ORB_PICKUP / BLOCK_NOTE_BLOCK_PLING
  claim-sound: ENTITY_PLAYER_LEVELUP
  # 音效音量 (0.0 - 1.0，超过1.0可扩大传播范围)
  sound-volume: 1.0
  # 音效音调 (0.5 - 2.0，1.0为原调)
  sound-pitch: 1.0
  # 领取成功粒子（Spigot Particle 枚举名，留空不播放）
  # 推荐：VILLAGER_HAPPY / TOTEM / HEART / NOTE / CLOUD / FLAME
  claim-particle: VILLAGER_HAPPY
  # 粒子数量
  particle-count: 30
  # 粒子扩散范围（相对于玩家位置的 XYZ 偏移）
  particle-offset: 0.6

# =========================================
# 数据存储
# ----------------------------------------------------------------------------
# 三种后端可同时开启，优先级固定为：MYSQL > SQLITE > YAML
# 已启用的后端中优先级最高者为「主存储」，承担全部读操作；
# 其余启用的后端作为「辅助存储」，写入时被镜像同步，充当热备份与降级方案。
# 例：同时开启 mysql 与 yaml -> MySQL 为主库，yaml 自动保持一份本地副本。
# =========================================
storage:
  backends:
    # ---------- YAML（零依赖，可作为辅助镜像或小型服主存储） ----------
    yaml:
      enabled: false
      # 数据文件路径，相对于 plugins/SOYSMyLoot/
      file: data/players.yml
      # 是否在每次写入前生成 .bak 备份
      backup-on-save: false

    # ---------- SQLite（默认启用，单文件数据库） ----------
    sqlite:
      enabled: true
      # 数据库文件路径，相对于 plugins/SOYSMyLoot/
      file: data/players.db
      # 表名前缀，避免与其他插件冲突
      table-prefix: 'mc_sml_'

    # ---------- MySQL（启用后自动成为主存储） ----------
    # 仅需下方精简字段，URL 直接用于建立并测试连接
    mysql:
      enabled: false
      # 完整 JDBC 连接串，驱动会通过 url 自动识别连接参数
      url: 'jdbc:mysql://localhost:3306/soysmyloot?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai'
      username: root
      password: ''
      table-prefix: 'mc_sml_'
      # 连接保活探测间隔（秒），防止长时间空闲被服务端断开。0 = 关闭
      keepalive-interval: 1800

  # ---------- 辅助存储镜像写入 ----------
  mirror:
    # 是否把写操作镜像到所有辅助存储
    enabled: true
    # 镜像写入是否异步执行（推荐 true，避免阻塞主线程）
    async: true
    # 插件启动时，是否用主存储的数据全量覆盖辅助存储
    sync-on-startup: false

# =========================================
# 排行榜
# ------------------------------------------------------------
# 按「累计伤害 / 击杀数」对 owner（玩家或队伍）排序，供指令与占位符使用。
# 聚合需扫描全表，故定时异步刷新并缓存。
# =========================================
leaderboard:
  # 展示/统计的名次数量上限
  limit: 10
  # 默认排序维度：damage（按伤害）| kills（按击杀）
  order: damage
  # 异步刷新间隔（秒）。0 = 关闭自动刷新（仅插件启动与 /myloot reload 时刷新一次）
  refresh-seconds: 60

# =========================================
# 赛季（自动重置）
# ------------------------------------------------------------
# 周期性清空进度，实现赛季制轮换。保留领取记录可让奖励不随赛季重置而重复领取。
# =========================================
season:
  # 是否启用自动重置
  auto-reset: false
  # 重置周期（小时）。例如 168 = 每周一清；744 = 每月
  period-hours: 168
  # 重置时是否保留奖励领取记录（true=仅清进度，false=全清含领取）
  keep-claims: true
