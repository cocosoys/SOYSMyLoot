# =========================================
# SOYSMyLoot 怪物配置
# =========================================
# 在此定义需要被追踪伤害/击杀的怪物。
# 玩家对这些怪物造成伤害时，插件会按 怪物ID 累计记录 总伤害 与 击杀数。
# 这些数据用于 rewards.yml 中的奖励条件判断，以及 PlaceholderAPI 占位符。

monsters:
  # ---------- 怪物ID（唯一，奖励条件与占位符通过它引用）----------
  example_zombie:
    # 实体类型，需与 org.bukkit.entity.EntityType 枚举名一致（全大写）
    type: ZOMBIE
    # 自定义名称匹配（支持 & 颜色代码）。留空 "" 表示匹配该类型的任意实体，不做名称限制
    name: ""
    # 显示名称：用于消息提示和占位符显示（仅展示用，不参与匹配）
    display-name: "示例僵尸"

  example_skeleton:
    type: SKELETON
    # 仅当实体自定义名称为“骷髅王”时才匹配（含 & 颜色代码需与实体实际名称一致）
    name: "&c骷髅王"
    display-name: "骷髅王"

  # ---------- MythicMobs / 自定义实体示例 ----------
  # mythic: 填写 MythicMobs 怪物的「内部名（Internal Name）」
  #   配置后，只要实体的内部名匹配即视为该怪物（忽略基础类型与显示名）。
  #   注意：需安装 MythicMobs 插件，否则该怪物永远无法匹配（插件启动时会给出警告）。
  #   自定义实体（非 MythicMobs）通常用其「显示名」配置上方 name 字段即可。
  example_mythic:
    type: ZOMBIE            # 基础实体类型（作为兼容/类型提示，配置 mythic 后实际按内部名匹配）
    mythic: SkeletalKnight  # MythicMobs 内部名（请替换为你的实际怪物内部名）
    name: ""
    display-name: "骷髅骑士"

# 提示：
# - 若服务器使用了 MythicMobs 等插件生成的实体，推荐用 mythic 字段按「内部名」匹配（最精确）。
# - 也可使用其“显示名”配置上方 name 字段。
# - 同名怪物多次出现时，伤害与击杀为“累计”计算（跨多次刷怪累加）。
