name: SOYSMyLoot
version: '${project.version}'
main: soys.soysmyloot.SOYSMyLoot
api-version: 1.12
author: Soys
description: 根据玩家对配置怪物造成的伤害/击杀发放奖励的战利品插件

# 强制依赖：PlaceholderAPI 必须存在插件才能启用
depend: [PlaceholderAPI]
# 软依赖：可选功能（经济/点券），缺失时对应奖励项自动跳过并提示
softdepend: [Vault, PlayerPoints]

commands:
  myloot:
    description: SOYSMyLoot 主指令
    aliases: [ml, loot]
    permission: soysmyloot.use
    usage: /myloot <help|reload|list|claim|progress|info>

permissions:
  soysmyloot.use:
    description: 允许使用基础指令（help/list/claim/progress/info）
    default: true
  soysmyloot.admin:
    description: 允许使用管理指令（reload）
    default: op
